services:
  vrtlmod-workspace:
    image: tum-ei-eda/vrtlmod-base:latest-default-debian-stable
    env_file: ".env"
    build:
      context: ..
      dockerfile: docker/dockerfile
      target: vrtlmod-base
      args:
        workspace_dir: "${workspace_dir}"
        ENV_LLVM_FROM_SOURCE: "${ENV_LLVM_FROM_SOURCE}"
        ENV_LLVM_VERSION: "${ENV_LLVM_VERSION}"
        ENV_BUILD_CONFIG: "${ENV_BUILD_CONFIG}"
        ENV_BUILD_CXX_STANDARD: "${ENV_BUILD_CXX_STANDARD}"
    environment:
      workspace_dir: "${workspace_dir}"
    volumes:
      - type: bind
        source: ..
        target: ${workspace_dir}
