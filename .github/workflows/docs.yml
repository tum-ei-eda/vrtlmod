name: Documentation - GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    paths:
      - docs/**
      - include/**
      - src/**
      - CMakeLists.txt
      - .github/workflows/docs.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone vRTLmod
        uses: actions/checkout@v4

      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake doxygen graphviz

      - name: Configure documentation
        run: cmake -S docs -B build-docs

      - name: Generate documentation site
        run: cmake --build build-docs --target pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-docs/docs/site

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
